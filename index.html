<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanzo Skins</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="roulette.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="firefly-bg"></div>
    <div class="app-container">
        <!-- HEADER -->
        <header class="header" id="main-header">
            <div class="balance-box" style="display: flex; align-items: center;">
                <img src="img/nav_diamond.png" class="coin-glow" alt="coin" style="width:24px; margin-right:8px;">
                <span id="balance">10000</span>
            </div>
            <!-- Popolnit tugmasi neon uslubiga o'tdi -->
            <button class="topup-btn-header" data-lang="topup" onclick="showPage('topup-menu', this)">ПОПОЛНИТЬ</button>
        </header>

        <main>
            <!-- CASES PAGE -->
            <div id="page-cases" class="page active">
                <h2 class="section-title" data-lang="cases_title">CASES</h2>
                <div id="cases-grid" class="grid"></div>
            </div>

            <!-- BONUS PAGE -->
            <div id="page-bonus" class="page">
                <div class="bonus-hero" style="text-align: center; padding: 20px 0;">
                    <img src="img/nav_diamond.png" class="coin-glow" alt="coin" style="width:60px; margin-bottom:10px;">
                    <h2 id="balance-large" style="font-size: 32px; margin: 0; color: #8A2BE2;">10000</h2>
                    <p style="color: #777; font-size: 14px; margin-top: 5px;" data-lang="balance_desc">Sizning balansingiz</p>
                </div>
                <h2 class="section-title" data-lang="bonus_title">DOIMIY BONUSLAR</h2>
                
                <div class="task-card-pro">
                    <div class="task-info-main">
                        <div class="task-icon-circle">🎁</div>
                        <div class="task-text-content">
                            <h4 data-lang="daily_reward">Kunlik mukofot</h4>
                            <p data-lang="daily_desc">+50 dan 5000 COINgacha</p>
                        </div>
                    </div>
                    <button id="bonus-btn" onclick="claimDailyBonus()" class="btn-action-pro" data-lang="claim_btn">OLISH</button>
                </div>

                <div class="task-card-pro">
                    <div class="task-info-main">
                        <div class="task-icon-circle">👥</div>
                        <div class="task-text-content">
                            <h4 data-lang="referral_title">Do'stlarni taklif qilish</h4>
                            <p data-lang="referral_desc">Har bir do'st uchun +500 COIN</p>
                        </div>
                    </div>
                    <button onclick="copyRefLink()" class="btn-action-pro" data-lang="link_btn">LINK</button>
                </div>

                <div id="active-tasks-list" class="task-container"></div>
                <div id="done-tasks-list" class="task-container"></div>
            </div>

            <!-- INVENTORY PAGE -->
            <div id="page-inventory" class="page">
                <h2 class="section-title" data-lang="inventory_title">INVENTORY</h2>
                <button onclick="sellAllInventory()" class="btn-action-pro" style="width: 90%; margin: 10px auto; display: block; background: #e74c3c !important;">BARCHASINI SOTISH</button>
                <div id="inventory-grid" class="grid"></div>
            </div>

            <!-- PROFILE PAGE -->
            <div id="page-profile" class="page">
                <div class="profile-header" style="text-align: center; padding: 20px 0;">
                    <div class="avatar-glow-large">
                        <img src="img/profile.png" style="width: 100%; border-radius: 50%;" id="profile-pic">
                    </div>
                    <h3 id="user-name" style="margin-top: 10px; color: white;">Foydalanuvchi</h3>
                </div>
                <div class="profile-menu">
                    <div class="menu-item-card"><span class="menu-icon">👤</span> <span class="menu-text">Mening profilim</span></div>
                    <div class="menu-item-card" onclick="toggleTradeSection()"><span class="menu-icon">🔗</span> <span class="menu-text">Trade Link</span></div>
                    <div class="menu-item-card" onclick="toggleSettings()"><span class="menu-icon">⚙️</span> <span class="menu-text">Sozlamalar</span></div>
                </div>

                <!-- Trade Link Section -->
                <div id="trade-input-section" class="settings-drawer">
                    <input type="text" id="tradeLinkInput" placeholder="https://steamcommunity.com/..." style="width: 100%; margin-bottom: 10px;">
                    <button onclick="saveSteamLink()" class="btn-action-pro">SAQLASH</button>
                </div>
            </div>

            <!-- TOPUP PAGES -->
            <div id="page-topup-menu" class="page">
                <h2 class="section-title">TO'LDIRISH</h2>
                <div style="padding: 10px;">
                    <button class="btn-action-pro" style="width: 100%; margin-bottom: 15px;" onclick="showPage('topup-uzs', this)">🇺🇿 SO'M (UZS)</button>
                    <button class="btn-action-pro" style="width: 100%;" onclick="showPage('topup-usd', this)">🇺🇸 DOLLAR (USD)</button>
                </div>
            </div>
        </main>

        <!-- NAVIGATION (Rasmlar bilan yangilandi) -->
        <nav class="bottom-nav">
            <button class="nav-btn" onclick="showPage('bonus', this)">
                <img src="img/nav_bonus.png" alt="Bonus">
                <span data-lang="nav_bonus">Bonus</span>
            </button>
            <button class="nav-btn active" onclick="showPage('cases', this)">
                <img src="img/nav_cases.png" alt="Keyslar">
                <span data-lang="nav_cases">Keyslar</span>
            </button>
            <button class="nav-btn" onclick="showPage('inventory', this)">
                <img src="img/nav_inv.png" alt="Inv">
                <span data-lang="nav_inv">Inv</span>
            </button>
            <button class="nav-btn" onclick="showPage('profile', this)">
                <img src="img/nav_profile.png" alt="Profile">
                <span data-lang="nav_profile">Profile</span>
            </button>
        </nav>
    </div>

    <!-- RULETKA VA PREVIEW MODALLARI O'Z HOLICHA QOLDI -->
    <div id="roulette-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; justify-content:center; align-items:center; flex-direction:column;">
        <div id="roulette-viewport" style="width:100%; overflow:hidden; height:160px;">
            <div id="roulette-track" style="position:relative; top:0; display:flex; flex-direction:column; align-items:center;"></div>
        </div>
        <div id="result-display" style="display:none; text-align:center; color:#fff; padding:20px;">
            <h3>YUTUQ!</h3>
            <img id="won-skin-img" style="width:150px; border-radius:10px; margin-bottom:10px;">
            <p id="won-skin-name" style="font-size:20px; font-weight:bold; margin-bottom:5px;"></p>
            <p id="won-skin-price" style="font-size:16px; color:#f1c40f; margin-bottom:20px;"></p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="sellWonSkin()" class="btn-action-pro" style="background:#e74c3c !important;">SOTISH</button>
                <button onclick="withdrawWonSkin()" class="btn-action-pro" style="background:#2ecc71 !important;">STEAM</button>
                <button onclick="spinAgainAndSave()" class="btn-action-pro" style="grid-column: span 2;">YANA AYLANTIRISH</button>
                <button onclick="exitAndSave()" class="btn-action-pro" style="grid-column: span 2; background:#7f8c8d !important;">CHIQISH</button>
            </div>
        </div>
    </div>

    <div id="preview-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-preview" onclick="closePreview()">&times;</span>
            <div id="preview-case-info">
                <img id="preview-case-img" src="" style="width:120px;">
                <h2 id="preview-case-name"></h2>
                <button id="preview-open-btn" class="btn-action-pro">OCHISH</button>
            </div>
            <hr style="border: 0.5px solid rgba(138,43,226,0.2); margin: 15px 0;">
            <h4 style="font-size: 12px; color: #8A2BE2;">KEYS ICHIDAGI SKINLAR:</h4>
            <div id="preview-skins-grid" class="preview-grid"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
